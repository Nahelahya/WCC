services:
  db:
    image: postgres:16-alpine
    container_name: wcc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcc
      POSTGRES_PASSWORD: wcc
      POSTGRES_DB: wcc
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - wcc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcc -d wcc"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wcc-db-data:
